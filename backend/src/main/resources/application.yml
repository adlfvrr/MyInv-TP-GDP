server:
  port: 8080

spring:
  application:
    name: myinv-backend
  autoconfigure:
    # La autenticación es propia (JWT + tabla usuario): no se usa el usuario en memoria de Spring.
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/myinv}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      # El esquema lo crean los scripts de /database: Hibernate no crea ni modifica tablas.
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: America/Argentina/Buenos_Aires
  jackson:
    time-zone: America/Argentina/Buenos_Aires

myinv:
  jwt:
    # En producción definir la variable JWT_SECRET (mínimo 32 caracteres).
    secret: ${JWT_SECRET:myinv-la-previa-clave-de-desarrollo-cambiar-en-produccion-2026}
    expiracion-segundos: 28800
  cors:
    origenes-permitidos: ${CORS_ORIGINS:http://localhost:5173}
